name: Fikra Code CI

# One Linux job: build once, run focused tests, run the end-to-end smoke test.
# Windows and optimized builds only run in the release workflow (on tags).
on:
  push:
    branches: [main]
    paths: ['codex-rs/**', 'scripts/fikra/**', '.github/workflows/fikra-ci.yml']
  pull_request:
    paths: ['codex-rs/**', 'scripts/fikra/**', '.github/workflows/fikra-ci.yml']
  workflow_dispatch:

concurrency:
  group: fikra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "8388608"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      # One cache shared by every run. Only main saves it, so PRs never evict it.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: fikra-linux-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fikra
        working-directory: codex-rs
        run: cargo build -p codex-cli --bin fikra

      - name: Focused tests
        working-directory: codex-rs
        run: |
          cargo test -p codex-http-client --lib fikra_blocklist
          cargo test -p codex-utils-home-dir --lib
          cargo test -p codex-model-provider-info --lib
          cargo test -p codex-models-manager --lib

      - name: Install screen checker
        run: pip install --quiet pyte

      - name: Smoke test
        env:
          FIKRA_API_KEY: ${{ secrets.FIKRA_API_KEY }}
        run: scripts/fikra/smoke.sh codex-rs/target/debug/fikra

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fikra-linux-x86_64-debug
          path: codex-rs/target/debug/fikra
          retention-days: 7
