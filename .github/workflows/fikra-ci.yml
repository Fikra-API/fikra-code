name: Fikra Code CI

# Three jobs. `linux` builds, runs the focused tests and the end-to-end smoke
# test. `cross-platform-build` compiles the CLI and test binaries on macOS and
# Windows so those targets are verified before a tag, not on it.
# `release-workflow-lint` parses the release workflow, which otherwise only runs
# on a tag.
on:
  push:
    branches: [main]
    paths: ['codex-rs/**', 'scripts/fikra/**', '.github/workflows/fikra-ci.yml']
  pull_request:
    paths: ['codex-rs/**', 'scripts/fikra/**', '.github/workflows/fikra-ci.yml']
  workflow_dispatch:

concurrency:
  group: fikra-ci-${{ github.ref }}
  # A pull request may supersede its own older run, but main must finish every
  # commit: a cancelled main run means that commit was never verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "8388608"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      # One cache shared by every run. Only main saves it, so PRs never evict it.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: fikra-linux-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fikra
        working-directory: codex-rs
        run: cargo build -p codex-cli --bin fikra

      - name: Focused tests
        working-directory: codex-rs
        run: |
          cargo test -p codex-http-client --lib fikra_blocklist
          cargo test -p codex-utils-home-dir --lib
          cargo test -p codex-model-provider-info --lib
          cargo test -p codex-async-utils --lib
          cargo test -p codex-login --lib fikra_usage
          cargo test -p codex-models-manager --lib
          cargo test -p codex-models-manager --lib fikra_catalog
          cargo test -p codex-core --lib unfinished_reply
          cargo test -p codex-core --lib turn_completion
          cargo test -p codex-tui --lib fikra_commands
          cargo test -p codex-tui --lib undo::
          cargo test -p codex-tui --lib budget::
          cargo test -p codex-core --lib undo_journal
          cargo test -p codex-core --lib safety::tests
          cargo test -p codex-core --lib resume_restores

      - name: Install screen checker
        run: pip install --quiet pyte

      - name: Smoke test
        env:
          FIKRA_API_KEY: ${{ secrets.FIKRA_API_KEY }}
        run: scripts/fikra/smoke.sh codex-rs/target/debug/fikra

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fikra-linux-x86_64-debug
          path: codex-rs/target/debug/fikra
          retention-days: 7

  cross-platform-build:
    # Compile-only on the two platforms the Linux job cannot cover. A PR that
    # breaks macOS or Windows currently surfaces at tag time, on the release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Enable git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          exit 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: cross-${{ matrix.target }}

      # Compile the CLI and the tests that touch platform code, without running
      # them, so a broken Windows/macOS build fails here instead of at a tag.
      - name: Build fikra
        working-directory: codex-rs
        run: cargo build --target ${{ matrix.target }} -p codex-cli --bin fikra

      # Compile the test binaries only. `cargo test -p codex-tui --no-run` also
      # builds the codex-tui binary target, whose external `codex_tui` import
      # resolves differently under the Windows dev profile; the library tests are
      # what exercise the platform code, so build those with --lib.
      - name: Compile tests (no run)
        working-directory: codex-rs
        run: |
          cargo test --target ${{ matrix.target }} -p codex-core --lib --no-run
          cargo test --target ${{ matrix.target }} -p codex-tui --lib --no-run

  release-workflow-lint:
    # A release workflow only runs on a tag, so a mistake there is found at the
    # worst moment. Parse it on every change and fail on syntax errors.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate release workflow YAML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import sys, yaml
          path = ".github/workflows/fikra-release.yml"
          with open(path) as handle:
              doc = yaml.safe_load(handle)
          jobs = doc.get("jobs") or {}
          for required in ("create-release", "prepare", "build", "verify-signatures"):
              if required not in jobs:
                  sys.exit(f"release workflow is missing job {required!r}")
          perms = doc.get("permissions") or {}
          if perms.get("id-token") != "write":
              sys.exit("release workflow must grant id-token: write for keyless signing")

          with open(path) as handle:
              text = handle.read()

          # A release that is published as a draft is invisible to users.
          if "--draft=false" not in text:
              sys.exit("release must be created with --draft=false")

          # Every `uses:` must exist. A fabricated action SHA only fails on a tag.
          import json, re, urllib.request
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          uses = sorted(set(re.findall(r"uses:\s*([^\s#]+)", text)))
          for ref in uses:
              if "@" not in ref or ref.startswith("./"):
                  continue
              # `owner/repo/sub/dir@sha` — the API wants only owner/repo.
              repo, sha = ref.rsplit("@", 1)
              repo = "/".join(repo.split("/")[:2])
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  sys.exit(f"{ref} is not pinned to a full commit SHA")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/commits/{sha}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              try:
                  urllib.request.urlopen(req, timeout=20)
              except Exception as error:
                  sys.exit(f"action {ref} does not resolve: {error}")

          # syft must scan extracted contents; given a tarball it records one file.
          if 'syft "dir:' not in text:
              sys.exit("SBOM generation must scan extracted contents (syft \"dir:...\")")
          print("release workflow OK:", ", ".join(jobs), "| actions:", len(uses))
          PY
