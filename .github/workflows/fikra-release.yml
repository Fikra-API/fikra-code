name: Fikra Code release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'
      target:
        description: 'Build all, linux, macos, or windows'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

permissions:
  contents: write
  # Keyless cosign signing uses the workflow's OIDC identity, so no key is stored.
  id-token: write
  attestations: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Fikra Code $tag" \
              --notes "Fikra Code $tag" \
              --draft=false

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target || 'all' }}"
          if [[ "$target" == "linux" ]]; then
            echo 'matrix={"include":[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          elif [[ "$target" == "macos" ]]; then
            echo 'matrix={"include":[{"target":"aarch64-apple-darwin","runner":"macos-15"},{"target":"x86_64-apple-darwin","runner":"macos-15"}]}' >> "$GITHUB_OUTPUT"
          elif [[ "$target" == "windows" ]]; then
            echo 'matrix={"include":[{"target":"x86_64-pc-windows-msvc","runner":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm"},{"target":"aarch64-apple-darwin","runner":"macos-15"},{"target":"x86_64-apple-darwin","runner":"macos-15"},{"target":"x86_64-pc-windows-msvc","runner":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [create-release, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f | Out-Null
          exit 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: codex-rs
          cache-on-failure: true
          shared-key: release-optz-${{ matrix.target }}

      - name: Install Zig
        if: contains(matrix.target, 'linux')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: contains(matrix.target, 'linux')
        env:
          TARGET: ${{ matrix.target }}
          CODEX_MUSL_RELEASE_LINK_FLAGS: "1"
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy (musl)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          key="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          echo "${key//-/_}=1" >> "$GITHUB_ENV"

      - name: Build bwrap
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo build --target "${{ matrix.target }}" --release --bin bwrap
          bwrap_path="target/${{ matrix.target }}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target "${{ matrix.target }}" --release \
            --bin fikra \
            --bin codex-exec-server

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "${{ matrix.target }}" \
            --bundle primary \
            --entrypoint-dir "target/${{ matrix.target }}/release" \
            --archive-dir "dist/${{ matrix.target }}"

      - name: Rename and checksum archive
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          if [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
            old="codex-package-${{ matrix.target }}.zip"
            new="fikra-package-${{ matrix.target }}.zip"
          else
            old="codex-package-${{ matrix.target }}.tar.gz"
            new="fikra-package-${{ matrix.target }}.tar.gz"
          fi
          path="dist/${{ matrix.target }}/${old}"
          mv "$path" "dist/${{ matrix.target }}/${new}"
          if command -v sha256sum >/dev/null 2>&1; then
            sum="$(sha256sum "dist/${{ matrix.target }}/${new}" | awk '{print $1}')"
          else
            sum="$(shasum -a 256 "dist/${{ matrix.target }}/${new}" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$sum" "$new" > "dist/${{ matrix.target }}/${new}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.0.2

      - name: Sign archive (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd codex-rs/dist/${{ matrix.target }}
          for archive in fikra-package-*.tar.gz fikra-package-*.zip; do
            [[ -e "$archive" ]] || continue
            # Keyless: the signature is bound to this workflow run's OIDC identity,
            # so verification needs no published public key to be trusted blindly.
            cosign sign-blob --yes \
              --bundle "${archive}.sigstore.json" \
              "$archive"
          done

      - name: Install syft
        uses: anchore/sbom-action/download-syft@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          syft-version: v1.14.0

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs/dist/${{ matrix.target }}
          for archive in fikra-package-*.tar.gz fikra-package-*.zip; do
            [[ -e "$archive" ]] || continue
            # Scan the extracted tree. Pointing syft at the archive itself records
            # one opaque `file` component and no dependencies.
            work="$(mktemp -d)"
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d "$work"
            else
              tar -xzf "$archive" -C "$work"
            fi
            # CycloneDX, the format most consumers (Dependency-Track, GitHub, Grype) read.
            syft "dir:$work" -o cyclonedx-json > "${archive}.sbom.cdx.json"
            rm -rf "$work"
            # Fail loudly rather than publish a header-only SBOM.
            components="$(
              python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components',[])))" \
                "${archive}.sbom.cdx.json"
            )"
            if [[ "$components" -eq 0 ]]; then
              echo "SBOM for $archive has no components" >&2
              exit 1
            fi
            echo "$archive: $components components"
          done

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd codex-rs/dist/${{ matrix.target }}
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            fikra-package-* \
            --clobber --repo "${GITHUB_REPOSITORY}"

  verify-signatures:
    # Proves the published signatures verify against this repository's workflow
    # identity, so a user can check a download without trusting a bundled key.
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.0.2

      - name: Verify every signed archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'fikra-package-*' \
            --clobber
          checked=0
          for bundle in *.sigstore.json; do
            [[ -e "$bundle" ]] || continue
            archive="${bundle%.sigstore.json}"
            cosign verify-blob "$archive" \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/fikra-release.yml@refs/tags/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            checked=$((checked + 1))
          done
          if [[ "$checked" -eq 0 ]]; then
            echo "No signature bundles were published" >&2
            exit 1
          fi
          echo "verified $checked signed archives"
